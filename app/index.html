<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>OpenPark — Real-Time Smart Parking &amp; Urban Mobility</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="manifest" href="/app/manifest.json" />

  <!-- Preload Typography & MapLibre GL -->
  <link rel="stylesheet" href="/app/vendor/fonts/fonts.css" />
  <link rel="stylesheet" href="/app/vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="/app/css/app.css?v=20261120_v37" />
</head>
<body>

  <!-- Fullscreen Interactive Map Canvas -->
  <div id="map" role="region" aria-label="City Parking Map"></div>

  <!-- Top Floating Search & Island Header -->
  <header class="top-island-wrap" role="search">
    <div class="search-bar-pill glass">
      <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Where to? (e.g. Indiranagar, MG Road, Forum Mall...)"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="search-clear-btn" class="search-clear-btn" aria-label="Clear search" title="Clear">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div id="gps-status-pill" class="gps-status-pill" title="Live Device Location Status">
        <span class="gps-dot"></span>
        <span id="gps-status-text">Locating…</span>
      </div>
    </div>

    <!-- Instant Dropdown Search Suggestions -->
    <div id="autocomplete-dropdown" class="autocomplete-dropdown glass" role="listbox"></div>
  </header>

  <!-- Turn-by-Turn Dynamic Island Banner (shown during active route) -->
  <div id="nav-island-banner" class="nav-island-banner glass" role="alert">
    <div class="nav-maneuver-icon">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
      </svg>
    </div>
    <div class="nav-instruction-text">
      <div class="nav-instruction-main" id="nav-instruction-main">Proceed to destination</div>
      <div class="nav-instruction-sub" id="nav-instruction-sub">1.2 km • ~4 mins ETA</div>
    </div>
    <button id="btn-nav-abort" class="nav-abort-btn pressable">End Route</button>
  </div>

  <!-- Right Floating Map Controls HUD -->
  <div class="map-controls-cluster glass" role="toolbar" aria-label="Map Controls">
    <button id="btn-zoom-in" class="map-control-btn pressable" title="Zoom In" aria-label="Zoom in">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button id="btn-zoom-out" class="map-control-btn pressable" title="Zoom Out" aria-label="Zoom out">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <div class="control-divider"></div>
    <button id="btn-my-location" class="map-control-btn pressable" title="My Location (Hold/Drag pin to calibrate)" aria-label="My Location">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
    </button>
    <button id="btn-tilt-3d" class="map-control-btn pressable" title="Toggle 3D View" aria-label="Toggle 3D">
      3D
    </button>
    <button id="btn-compass-north" class="map-control-btn pressable" title="Reset North" aria-label="Reset North">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2">
        <polygon points="12 2 15 11 12 8 9 11 12 2" fill="currentColor"/>
        <polygon points="12 22 9 13 12 16 15 13 12 22" fill="none"/>
      </svg>
    </button>
  </div>

  <!-- Bottom Drawer: Nearby Parking Cards & Filters -->
  <section id="bottom-drawer" class="bottom-drawer glass" aria-label="Parking Drawer">
    <div class="drawer-header">
      <div id="drawer-grab-bar" class="drawer-grab-bar" title="Expand / Collapse Drawer"></div>
      <div class="drawer-title-row">
        <div class="drawer-title">Nearby Parking</div>
        <div id="drawer-count-badge" class="drawer-count-badge">0 lots</div>
      </div>
    </div>

    <!-- Quick Filter Chips -->
    <div class="filter-chips-row">
      <button class="chip-btn pressable active" data-filter="all">All</button>
      <button class="chip-btn pressable" data-filter="Available">
        <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#10b981;"></span>
        Vacant Now
      </button>
      <button class="chip-btn pressable" data-filter="ev">⚡ EV Charging</button>
      <button class="chip-btn pressable" data-filter="budget">💰 Budget (≤₹30)</button>
      <button class="chip-btn pressable" data-filter="covered">🛡️ Covered</button>
    </div>

    <!-- Scrollable Parking Lots List -->
    <div id="lots-list-scroll" class="lots-list-scroll">
      <div style="text-align:center;padding:28px 16px;color:var(--text-muted);">
        Finding parking spots near you…
      </div>
    </div>
  </section>

  <!-- Toast Notification Stack -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="/app/vendor/maplibre-gl.js"></script>
  <script type="module" src="/app/js/app.js?v=20261120_v37"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/app/sw.js?v=20261120_v37', { scope: '/app/' })
          .then((reg) => reg.update())
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
